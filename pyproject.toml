[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climate-disclosure-agent"
version = "0.1.0"
description = "Climate Disclosure Agent"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "pgvector>=0.5.1",
    "pydantic-settings",
    "pymupdf<2",
    "pyyaml",
    "sqlalchemy[asyncio]",
    "sentence-transformers",
    "torch",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest-asyncio",
    "pytest",
    "ruff",
    "testcontainers[postgres]",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cda"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: requires a PostgreSQL container", "model: downloads and runs the real embedding model"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
