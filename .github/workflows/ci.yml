name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: No Python project yet
        if: hashFiles('pyproject.toml') == ''
        run: echo "pyproject.toml not found; nothing to check yet."
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('pyproject.toml') != ''
      - name: Install
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --frozen
      - name: Ruff
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        if: hashFiles('pyproject.toml') != ''
        run: uv run mypy src
      - name: Pytest
        if: hashFiles('pyproject.toml') != ''
        env:
          CDA_REQUIRE_DOCKER: "1"
        run: uv run pytest -q
      - name: Retrieval gate (synthetic company, no model calls)
        if: hashFiles('pyproject.toml') != ''
        run: uv run python -m cda.eval.ci_gate --summary "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright (API mocked, D81)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
