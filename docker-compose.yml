services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cda
      POSTGRES_PASSWORD: cda
      POSTGRES_DB: cda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cda -d cda"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cda:cda@db:5432/cda
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "cda.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cda:cda@db:5432/cda
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "cda.runner.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cda:cda@db:5432/cda
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
